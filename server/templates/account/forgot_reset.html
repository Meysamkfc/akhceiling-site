{% extends "_base.html" %}{% from "_macros.html" import csrf, errs %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block content %}<div class="wrap"><div class="authbox card pad">
<h1>تغییر رمز عبور</h1>
{{ errs(errors) }}
<form method="post" class="form">{{ csrf() }}
<div class="row2"><div><label for="password">رمز عبور جدید *</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password"></div>
<div><label for="password2">تکرار رمز جدید *</label><input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password"></div></div>
<p class="note">رمز عبور حداقل ۱۰ کاراکتر، شامل حرف لاتین و عدد و غیرقابل‌حدس باشد.</p>
<button class="btn" type="submit">تغییر رمز</button></form>
</div></div>{% endblock %}
