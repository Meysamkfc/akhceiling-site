# /etc/nginx/sites-available/akh   (replace akhceiling.com with your domain)
limit_req_zone $binary_remote_addr zone=akh_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=akh_api:10m rate=60r/m;

server {
    listen 80;
    server_name akhceiling.com www.akhceiling.com;
    return 301 https://akhceiling.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name akhceiling.com;
    # certificates: sudo certbot --nginx -d akhceiling.com -d www.akhceiling.com
    ssl_certificate     /etc/letsencrypt/live/akhceiling.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akhceiling.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;       # order uploads (3 files x 5 MB)
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # static files straight from disk (fast + cached); everything dynamic goes to the app
    location /assets/ {
        alias /srv/akh/site/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        # the same security headers must be repeated here (nginx does not inherit add_header)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }
    location = /account/login/ { limit_req zone=akh_login burst=5 nodelay; proxy_pass http://127.0.0.1:8790; include /etc/nginx/proxy_params; }
    location /api/             { limit_req zone=akh_api burst=30 nodelay;  proxy_pass http://127.0.0.1:8790; include /etc/nginx/proxy_params; }
    location / {
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;      # sets Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
    }
    # never serve source/config by accident
    location ~ /\.(?!well-known) { deny all; }
}
